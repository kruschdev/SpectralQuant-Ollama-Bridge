version: '3.8'

services:
  spectralquant-bridge:
    build: .
    container_name: spectralquant-bridge
    restart: always
    network_mode: "host"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:11437/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    environment:
      - PORT=11437
      - SPECTRALQUANT_URL=${SPECTRALQUANT_URL:-http://127.0.0.1:11434}
      - MOCK_MODEL_NAME=spectralquant:latest
      - FALLBACK_OLLAMA_URL=http://127.0.0.1:11434
      - REWRITE_MODEL_TO=${REWRITE_MODEL_TO:-qwen3.5:9b}
