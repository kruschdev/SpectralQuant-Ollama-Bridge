version: '3.8'

services:
  spectralquant-server:
    build: ./backend
    container_name: spectralquant-server
    restart: unless-stopped
    ports:
      - "11436:11436"
    environment:
      - MODEL_NAME=Qwen/Qwen2.5-Coder-7B-Instruct
      - HUGGINGFACE_HUB_CACHE=/root/.cache/huggingface
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      - ./backend:/app
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  spectralquant-bridge:
    build: .
    container_name: spectralquant-bridge
    restart: unless-stopped
    ports:
      - "11437:11437"
    environment:
      - PORT=11437
      - SPECTRALQUANT_URL=http://spectralquant-server:11436
      - MOCK_MODEL_NAME=spectralquant:latest
    depends_on:
      - spectralquant-server
